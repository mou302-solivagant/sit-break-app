<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>起身休息</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0f172a;
    color: #f1f5f9;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%; height: 100%;
    text-align: center;
    padding: 40px;
  }
  .countdown {
    font-size: 84px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #38bdf8;
  }
  .headline {
    margin-top: 12px;
    font-size: 22px;
    opacity: 0.85;
  }
  .card {
    margin-top: 40px;
    max-width: 640px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 28px 32px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: opacity 0.4s ease;
  }
  .card img {
    max-width: 100%;
    max-height: 320px;
    border-radius: 8px;
    margin: 0 auto;
  }
  .card h2 {
    font-size: 20px;
    margin-bottom: 12px;
    color: #7dd3fc;
  }
  .card p {
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-line;
    opacity: 0.92;
  }
  .fade-out { opacity: 0; }

  .emergency {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 120px;
    height: 44px;
    border-radius: 22px;
    background: rgba(255,255,255,0.08);
    color: #94a3b8;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .emergency .progress {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: rgba(239,68,68,0.55);
    transition: width 0.05s linear;
  }
  .emergency .label { position: relative; z-index: 1; }
  .emergency-hint {
    position: fixed;
    bottom: 74px;
    right: 24px;
    font-size: 11px;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="countdown" id="countdown">03:00</div>
    <div class="headline">起來動一動，休息一下 🧘</div>
    <div class="card" id="card">
      <h2 id="cardTitle">載入中…</h2>
      <p id="cardBody"></p>
    </div>
  </div>

  <div class="emergency-hint">長按3秒可緊急跳過</div>
  <div class="emergency" id="emergencyBtn">
    <div class="progress" id="emergencyProgress"></div>
    <div class="label">緊急跳過</div>
  </div>

  <script src="lock.js"></script>
</body>
</html>
