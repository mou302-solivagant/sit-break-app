<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>即將休息</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #1e293b;
    color: #f1f5f9;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 16px;
    text-align: center;
  }
  .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .sub { font-size: 12px; opacity: 0.7; margin-bottom: 12px; }
  .countdown { font-size: 12px; color: #38bdf8; margin-bottom: 10px; }
  button {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    background: #334155;
    color: #f1f5f9;
  }
  button:hover { background: #475569; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">30分鐘到了，該起身休息了</div>
    <div class="sub">不動作將自動進入鎖定畫面</div>
    <div class="countdown" id="countdown">20 秒後自動鎖定</div>
    <button id="skipBtn">跳過這一次</button>
  </div>
  <script src="skip.js"></script>
</body>
</html>
